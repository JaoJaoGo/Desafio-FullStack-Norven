[project]
name = "desafio-fullstack-norven"
version = "1.0.0"
description = "Desafio FullStack Norven"
readme = "README.md"
authors = [
    { name = "João V G Carrijo", email = "jvgcarrijo@outlook.com" }
]
requires-python = ">=3.14.5"
dependencies = [
    "alembic>=1.19.1",
    "annotated-doc>=0.0.5",
    "annotated-types>=0.8.0",
    "anyio>=4.14.2",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "cffi>=2.1.1",
    "click>=8.5.0",
    "colorama>=0.4.6",
    "cryptography>=50.0.1",
    "datetime>=6.0",
    "dnspython>=2.8.0",
    "ecdsa>=0.19.2",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.5",
    "gunicorn>=26.2.0",
    "h11>=0.16.0",
    "idna>=3.19",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pyasn1>=0.6.4",
    "pycparser>=3.0",
    "pydantic>=2.13.4",
    "pydantic-core>=2.46.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "pytz>=2026.3.post1",
    "rsa>=4.9.1",
    "six>=1.17.0",
    "sqlalchemy>=2.0.52",
    "starlette>=1.6.0",
    "typing>=3.10.0.0",
    "typing-extensions>=4.16.0",
    "typing-inspection>=0.4.4",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
